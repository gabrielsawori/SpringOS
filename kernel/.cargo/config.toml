[build]
# Secara otomatis menggunakan target kustom yang baru saja kita buat
target = "x86_64-springos.json"

[unstable]
# Memerintahkan Cargo untuk mengompilasi ulang library core untuk target kita
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.'cfg(target_os = "none")']
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=0x1000"
]